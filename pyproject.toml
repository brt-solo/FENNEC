[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fennec-search"
version = "0.1.0"
description = "FENNEC-Search: Fitness-guided Evolution of Niched Networks for Ensemble Causal discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FENNEC-Search authors" }]
keywords = ["causal discovery", "structure learning", "quality-diversity", "MAP-Elites", "XGBoost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are conservative; the code is tested with Python 3.11, numpy 2.4, pandas 2.3,
# scikit-learn 1.8, xgboost 3.2, networkx 3.6, joblib 1.6 and dowhy 0.14.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "networkx>=3.0",
    "joblib>=1.3",
    "dowhy>=0.11",
]

[project.optional-dependencies]
# structure-learning baselines used by benchmarks/ (CAM and BiDAG additionally need R; see benchmarks/README.md)
bench = ["scipy>=1.10", "causal-learn>=0.1.3.8", "torch>=2.0", "gcastle>=1.0.3"]
# figures and tables in experiments/
experiments = ["scipy>=1.10", "matplotlib>=3.7", "tabulate>=0.9"]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/fennec_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
